# On-policy self-distillation on ScienceQA (SciKnowEval Chemistry L3): one A100 80GB.

method: onpolicy
task: scienceqa
gpus: 0
dataset: scratch/data/builds/scienceqa
eval_data: scratch/data/scienceqa/eval.json
train:
  engine: vllm
  routing_strategy: pure_student
  alpha: 0.0
  loss_mask_strategy: all
  # Effective batch 8
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  steps_per_generation: 8
  # Generation
  temperature: 1.0
  top_k: 20
  top_p: 1.0
  max_prompt_length: 2048
  max_completion_length: 1024
  rollout_max_new_tokens: 1024
  eval_max_new_tokens: 1024
  # Optimization
  learning_rate: 5.0e-5
  warmup_ratio: 0.1
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  num_train_epochs: 8
  max_steps: 2672
  gradient_checkpointing: true
  # Teacher: EMA of the student, alpha 0.01 after every optimizer step
  sync_ref_model: true
  ref_model_mixup_alpha: 0.01
  ref_model_sync_steps: 1
  verify_frozen_teacher: false
  # Colocated vLLM for rollouts
  vllm_gpu_memory_utilization: 0.3
  vllm_kv_cache_memory_bytes: 7516192768
  vllm_enable_sleep_mode: false
  vllm_batch_weight_sync: true
  vllm_importance_sampling_correction: true
  # Online evaluation
  eval_scoring: evals.scorers:science_xml_match_scorer
  eval_scoring_kwargs: {}
  eval_every_n_steps: 100
  # Run records
  record_step_timing: true
  save_strategy: "no"
  save_final_model: false
