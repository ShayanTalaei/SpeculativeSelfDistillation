# Off-policy SFT on ScienceQA (SciKnowEval Chemistry L3): one A100 80GB, frozen-teacher targets sampled once before training.

method: sft
task: scienceqa
gpus: 0
dataset: scratch/data/builds/scienceqa
eval_data: scratch/data/scienceqa/eval.json
train:
  loss: sft
  # Effective batch 8
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  drop_last_effective_batch: true
  # Optimization
  learning_rate: 5.0e-5
  warmup_ratio: 0.1
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  weight_decay: 0.0
  num_train_epochs: 33
  gradient_checkpointing: true
  # Sequence lengths (prompt + completion, tokens)
  max_student_len: 1024
  max_teacher_len: 4096
  temperature: 1.0
  chat_template_kwargs: {enable_thinking: false}
  # Teacher targets: one completion per prompt, sampled once before training
  target_temperature: 1.0
  target_top_k: 20
  target_top_p: 1.0
  target_max_new_tokens: 1024
  verify_frozen_teacher: false
  # Online evaluation (the same vLLM engine also samples the targets)
  eval_scoring: evals.scorers:science_xml_match_scorer
  eval_scoring_kwargs: {}
  eval_every_n_steps: 100
  eval_max_new_tokens: 1024
  eval_max_num_seqs: 48
  eval_max_model_len: 4096
  vllm_gpu_memory_utilization: 0.3
  vllm_kv_cache_memory_bytes: 12884901888
  vllm_batch_weight_sync: false
  # Run records
  record_step_timing: true
  save_strategy: "no"
  save_final_model: false
