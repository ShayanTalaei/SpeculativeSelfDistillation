[project]
name = "speculative-self-distillation"
version = "1.0.0"
description = "Speculative self-distillation (SSD) with on-policy, SFT and forward-KL baselines"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"

# Direct dependencies at the versions of the released runs (see
# configs/versions.yaml). requirements.txt is the full transitive lock that
# setup.sh installs.
dependencies = [
    "torch==2.13.0",
    "vllm==0.31.0",
    "transformers==5.17.0",
    "trl==1.16.0",
    "accelerate==1.15.0",
    "peft==0.21.2",
    "datasets==5.1.0",
    "huggingface-hub==1.33.0",
    "pydra-config==0.0.17.post1",
    "wandb==0.30.0",
    "openai==3.31.0",
    "numpy==2.3.5",
    "pandas==3.0.6",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that load real models or need GPUs (skip with -m 'not slow')",
]
